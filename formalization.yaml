classification:
  arxiv: ["quant-ph", "math.NT", "math.MG"]
  msc2020: ["81P15", "11R37", "11R42", "11F20", "52C35"]

status:
  scope: >-
    Complete. Both endpoints in `MainResults.lean` are proved unconditionally, with no `sorry`,
    no project axioms, and no conjectural hypotheses; `lake build` prints their axioms. The Lean
    tree is restricted to the dependency closure of the two endpoints (about 168,000 lines in
    449 modules; roughly 7,500 declarations). Material of [AFK25] that the endpoints do not need,
    such as the full SIC classification, complete shift sets, Galois-orbit enumeration, and
    field-generation results, is deliberately not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "SIC.exists_SIC"
      file: "MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "SIC.exists_RSIC"
      file: "MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5", "claude-fable-5-1", "claude-opus-5", "claude-opus-5-5",
               "claude-sonnet-5", "claude-sonnet-5-5"]
      framework: "Claude Code"
      tool_setup: "Source analysis, proof planning, review, and integration, mostly by Claude Fable 5 and 5.1."
    - method: "agent"
      models: ["gpt-5.6-sol", "gpt-6-sol"]
      framework: "Codex CLI"
      tool_setup: "Lean proof writing and checking against Lean and Mathlib."
    - method: "other"
      models: ["gpt-6-astra"]
      framework: "ChatGPT"
      tool_setup: "Mathematical research support and exploration of proof routes."
    - method: "manual"
      tool_setup: "Human direction, source selection, design decisions, and review of statements and generated work."
  notes: >-
    All Lean proofs were written by Codex under Claude orchestration and human direction.
    Numerical checks in Mathematica and Python supported the development.

fidelity:
  divergences: >-
    Only the dependency closure of the existence endpoints is formalized; excluded topics are
    listed under status.scope. The real Shintani–Faddeev cocycle is defined along the canonical
    Hirzebruch–Jung word using [AFK25, (8.5)–(8.9)], rather than by meromorphic continuation of
    the upper-half-plane product of Definition 1.18; agreement is proved where that definition
    applies. The rank-one proof uses the explicit principal family and [RW26], independently
    of the rank-r existence theorem. The conditional ghost-to-live argument of [AFK25,
    Theorem 1.46] is made unconditional using [AFK26, Theorem 1.2] and [RW26b, Proposition 7].
    Class field theory uses explicit ray class group presentations and local completions,
    following Milne, Childress, and Neukirch. Restricted source statements, source errors,
    and simpler alternative arguments are documented at the relevant declarations.

review:
  status: "self-assessed"
  reviewers: ["Māris Ozols"]
  notes: >-
    Lean checks every proof; `lake build` prints the axioms of both endpoints. The author
    reviewed the two endpoint statements.

alignment:
  namespace: "SIC"
  note: >-
    Every formalized source statement carries an `@[source]` attribute naming the source, the
    statement number, its page, and its LaTeX label; the attribute is defined in
    `SICs/Source.lean`. The table below lists the endpoints and the principal inputs.
  statements:
    - source: "[AFK25, Conjecture 1.3] Zauner's conjecture (Weyl–Heisenberg covariant form)"
      lean: "SIC.exists_SIC"
      module: "MainResults.lean"
      status: "proved"
      note: "Stated with Mathlib notions only; the Weyl–Heisenberg covariance is not part of the statement."
    - source: "[AFK25, Theorem 1.46] rank-r SIC existence for admissible pairs"
      lean: "SIC.exists_RSIC"
      module: "MainResults.lean"
      status: "proved"
      note: "Proved unconditionally; the printed theorem is conditional on conjectures that the later sources discharge."
    - source: "[AFK25, Definition 1.2] equiangularity condition"
      lean: "SIC.IsRSIC"
      module: "SICs/Quantum/RSIC.lean"
      status: "proved"
    - source: "[AFK25, Definition 1.5] Weyl–Heisenberg group"
      lean: "SIC.displacementOperator"
      module: "SICs/Quantum/WeylHeisenberg.lean"
      status: "proved"
    - source: "[AFK25, Theorem 1.7] r-SICs as bases and the trace formula"
      lean: "SIC.rsic_linearIndependent, SIC.rsic_span_eq_top, SIC.rsic_sum_eq, SIC.rsic_trace_formula"
      module: "SICs/Quantum/RSIC.lean"
      status: "proved"
    - source: "[AFK25, Definition 1.21] admissible pair"
      lean: "SIC.AdmissiblePair"
      module: "SICs/Admissible/Pairs.lean"
      status: "proved"
    - source: "[AFK25, Definition 1.43] candidate ghost and SIC fiducials"
      lean: "SIC.AdmissibleTuple.GhostDatum.candidate, SIC.principalLiveCandidate"
      module: "SICs/Ghost/Datum.lean, SICs/Principal/Construction/Live.lean"
      status: "proved"
    - source: "[AFK25, Conjecture 1.35] Twisted Convolution Conjecture, principal case"
      lean: "SIC.principalFiniteShiftTCC"
      module: "SICs/Principal/Dilogarithm/TwistedConvolution.lean"
      status: "proved"
      note: "Proved for the principal family via [RW26, Theorem 7]; the general conjecture is not stated in Lean."
    - source: "[AFK26, Theorem 1.2] twisted convolution identity with shift −d_j"
      lean: "SIC.isShift_neg_towerDimension"
      module: "SICs/Dilogarithm/TwistedConvolution.lean"
      status: "proved"
      note: "Formalized for forms with a > 0, which suffices for every admissible pair."
    - source: "[RW26b, Proposition 7] unit modulus of the pseudolattice dilogarithm under Galois"
      lean: "SIC.pseudolatticeDilog_norm_map_eq_one"
      module: "SICs/Dilogarithm/Reciprocity/UnitaryConjugates.lean"
      status: "proved"
    - source: "[AFK25, Theorem 1.46] general live fiducial"
      lean: "SIC.AdmissiblePair.exists_liveFiducial"
      module: "SICs/Construction.lean"
      status: "proved"
    - source: "[AFK25, Conjecture 1.3] rank-one fiducial in every dimension"
      lean: "SIC.exists_rankOneFiducial"
      module: "SICs/Principal/Construction/Existence.lean"
      status: "proved"

