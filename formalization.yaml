version: "v0.4"

project:
  name: "SIC existence in Lean"
  description: >-
    An unconditional Lean 4 proof of SIC existence in every positive dimension and of rank-r
    SIC existence at every admissible pair (d, r) of [AFK25]. The two results in
    `MainResults.lean` use only Mathlib notions. The constructions follow Appleby, Flammia,
    and Kopp, with unconditional inputs from Radchenko and Wheeler. The project develops the
    required background in modular cocycles, special functions, finite quantum dilogarithms,
    quadratic forms, and ray class field theory. Its contribution is to assemble and formally
    verify the source arguments; no priority for the mathematics is claimed.
  authors:
    - "Māris Ozols"
  responsible_maintainers:
    - "Māris Ozols"
  license: "Apache-2.0"

# Pinned bibliography: REFERENCES.md; declaration-level citations: `@[source]`.
sources:
  - title: "A constructive approach to Zauner's conjecture via the Stark conjectures"
    authors: ["Marcus Appleby", "Steven T. Flammia", "Gene S. Kopp"]
    id: "arXiv:2501.03970v2"
    type: "article"
    location: >-
      Definitions 1.1–1.2, 1.5–1.6, 1.21, 1.43; Theorem 1.7; the ghost-to-live argument in the
      proof of Theorem 1.46; Sections 2–4 and 8 for the cocycle, Stark, and quadratic-form
      background. Each formalized statement is cited at its declaration by number and label.
    relationship: "formalizes"
    note: >-
      The main source. Its Theorem 1.4 proves Zauner's conjecture conditionally on the Twisted
      Convolution Conjecture and the rank-one abelian Stark conjecture for real quadratic fields;
      the formalization follows its construction but discharges both conditions through the
      later sources below, so the formal endpoints are unconditional. Errors and simplifications
      found while formalizing were reported to the authors, and the arXiv v2 incorporates fixes.
    author_endorsement: "endorsed"

  - title: "The Shintani–Faddeev modular cocycle: Stark units from q-Pochhammer ratios"
    authors: ["Gene S. Kopp"]
    id: "arXiv:2411.06763v3"
    type: "article"
    location: "Cited as [72] in [AFK25]; the Shintani–Faddeev cocycle and its Stark-unit values."
    relationship: "formalizes"
    author_endorsement: "endorsed"

  - title: "Real quadratic fields and finite quantum dilogarithms I"
    authors: ["Danylo Radchenko", "Campbell Wheeler"]
    id: "arXiv:2609.21892v2"
    type: "article"
    location: >-
      Cited as [RW26]; the rank-one twisted convolution identity (Theorem 7) and the finite
      quantum dilogarithm identities of Sections 2–5.
    relationship: "formalizes"
    author_endorsement: "endorsed"

  - title: "The twisted convolution identity and ghost r-SICs from finite quantum dilogarithms"
    authors: ["Marcus Appleby", "Steven T. Flammia", "Gene S. Kopp"]
    id: "arXiv:2609.39192v1"
    type: "article"
    location: >-
      Cited as [AFK26]; Theorem 1.2 (the twisted convolution identity with shift −d_j) and the
      lemmas of Sections 3–4 used by the general-rank ghost construction.
    relationship: "formalizes"
    author_endorsement: "endorsed"

  - title: "Stark units for real quadratic fields and reciprocity laws"
    authors: ["Danylo Radchenko", "Campbell Wheeler"]
    id: "https://www.danrad.net/papers/stark-reciprocity.pdf (manuscript dated 4 October 2026)"
